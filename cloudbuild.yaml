# The robot's instruction sheet. Same four steps as the slides:
#   1 Check (validate)  2 Inspect (guardrail)  3 Plan  4 Build (apply)
# Pull request trigger: _APPLY=false  -> steps 1-3 only (safe preview)
# Push-to-main trigger: _APPLY=true   -> all four steps (real build)

substitutions:
  _TF_STATE_BUCKET: ""
  _APPLY: "false"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: "0-init"
    name: "hashicorp/terraform:1.9.8"
    dir: "terraform"
    args: ["init", "-input=false", "-backend-config=bucket=${_TF_STATE_BUCKET}"]

  - id: "1-check"
    name: "hashicorp/terraform:1.9.8"
    dir: "terraform"
    args: ["validate"]

  - id: "2-inspect-guardrail"
    name: "bridgecrew/checkov:latest"
    entrypoint: "checkov"
    dir: "terraform"
    # CKV_GCP_2 = "Firewall must not allow SSH (port 22) from 0.0.0.0/0".
    args: ["-d", ".", "--framework", "terraform", "--check", "CKV_GCP_2", "--skip-path", ".terraform", "--compact", "--skip-download"]

  - id: "3-plan"
    name: "hashicorp/terraform:1.9.8"
    dir: "terraform"
    args: ["plan", "-input=false", "-var=project_id=$PROJECT_ID", "-out=tfplan"]

  - id: "4-build-apply"
    name: "hashicorp/terraform:1.9.8"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if [ "${_APPLY}" = "true" ]; then
          terraform apply -input=false -auto-approve tfplan
          terraform output
        else
          echo "Pull request: preview only. Merge to main to build it for real."
        fi
